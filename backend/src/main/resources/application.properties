spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties

# Basic Application Configuration
spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Cấu hình Spring Mail
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_SMTP}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


app.frontend.url = ${FRONTEND_URL}
jwt.secret=${JWT_SECRET}

# Số lượng người trong waitlist để tự động tạo lớp (có thể override qua biến môi trường WAITLIST_CAPACITY)
app.waitlist.capacity=${WAITLIST_CAPACITY:10}

# Tỷ lệ đạt để submission được đánh dấu GRADED sau khi peer review chấm xong
app.peer-review.pass-ratio=${PEER_REVIEW_PASS_RATIO:0.8}

