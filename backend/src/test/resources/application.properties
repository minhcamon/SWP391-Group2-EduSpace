# Disable configuration import for .env.properties during testing
spring.config.import=

# Basic Application Configuration
spring.application.name=backend-test
server.port=8080

# Database Configuration (Using H2 in-memory mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 Mock Configuration
spring.security.oauth2.client.registration.google.client-id=mock-google-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# Cấu hình Spring Mail Mock
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=mock-email-smtp
spring.mail.password=mock-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL & JWT Mock
app.frontend.url=http://localhost:3000
jwt.secret=mock-jwt-secret-key-which-is-long-enough-to-be-secure-for-testing-12345

# Cloudinary Mock Configuration
cloudinary.cloud-name=mock-cloud-name
cloudinary.api-key=mock-api-key
cloudinary.api-secret=mock-api-secret