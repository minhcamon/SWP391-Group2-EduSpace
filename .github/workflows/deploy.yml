name: CI/CD Pipeline for Monorepo

on:
  push:
    branches: [ "main" ] # Kích hoạt khi bạn push hoặc merge code vào nhánh main
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Test & Build Backend rồi đẩy lên Docker Hub
  # ----------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy test độc lập trước, nếu lỗi bước này hệ thống sẽ STOP ngay lập tức
      - name: Run Backend Tests
        run: mvn clean test

      # Test pass mới tiến hành đóng gói file JAR sinh ra trong thư mục target/
      - name: Build JAR with Maven
        run: mvn package -DskipTests

      # Đăng nhập vào Docker Hub bằng 2 biến Secret bạn vừa tạo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Đóng gói Dockerfile và đẩy lên repo minhcamon1/edu-space
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }} # Chỉ push khi merge vào main, chạy PR thì chỉ build thử xem lỗi không
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edu-space:latest

  # ----------------------------------------------------
  # JOB 2: Test & Build Frontend (React)
  # ----------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Production
        run: npm run build
        env:
          CI: true